<style>

#app{max-width:1200px;margin:0 auto}
.lock{padding:26px 16px;max-width:520px;margin:0 auto}.lock h1{font-size:25px;margin:6px 0;color:var(--h1)}.sub{color:var(--mute);font-size:16px;margin:0 0 14px}
.note{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(10,90,70,.15)}
.btn{font:inherit;font-weight:800;border:0;background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff}

.home{padding:18px 14px 50px}.hh{font-size:20px;font-weight:900;margin:8px 4px 12px}.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:block;text-decoration:none;color:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(10,60,60,.2)}.gc b{display:block;font-size:26px;line-height:1.25}.gc span{font-size:16px;font-weight:600}

.top{display:block;padding:0}.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding:12px 8px 60px}article{background:#fff;border-radius:20px;margin:0 0 26px;overflow:hidden;box-shadow:0 8px 24px rgba(10,60,60,.16);scroll-margin-top:106px}

  if (!D.reportUrl) return {allow: true};
  for (let i = 0; i < 2; i++) {
    if (i) { const m = document.getElementById('msg'); if (m) m.textContent = '서버 응답이 늦어 한 번 더 확인하는 중…'; }
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(D.reportUrl, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({event: 'start', name, range, device: DEVICE, app: D.title, salt: D.enc ? D.salt : undefined, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)})});
      const txt = await r.text();
      try { const j = JSON.parse(txt); return typeof j.allow === 'boolean' ? j : {allow: true}; } catch (e) { return {allow: true, legacy: true}; }
    } catch (e) { if (i) return {allow: false, offline: true}; await new Promise(res => setTimeout(res, 1500)); }
    finally { clearTimeout(t); }
  }
}
function nameOk() {
  const name = cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name', name); $('#msg').textContent = ''; return true;
}
function renderLocked() {
  let saved = exst.get('name', ''); try { saved = saved || localStorage.getItem('leess-vname') || ''; } catch (e) {}
  $('#app').innerHTML = `<div class="lock"><h1>${esc(D.school)} ${esc(D.short)}</h1><p class="sub">${esc(D.sub)}</p>
  <div class="note"><b>교재 열기</b><p style="margin:6px 0 10px">본인 이름(실명)을 쓰고 「교재 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다. ${esc(D.notice)}</p>
  <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}" style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)">
  <p id="msg" style="color:var(--ng);font-size:14px;min-height:1.4em;margin:8px 0"></p>
  <button class="btn pri" id="openWb" style="width:100%;padding:10px">교재 열기</button></div></div>`;
  $('#openWb').onclick = openWb;
}
async function openWb() {
  if (!nameOk()) return;
  $('#msg').textContent = '서버에서 이름·기기를 확인하는 중…'; $('#openWb').disabled = true;
  const g = await gate(exst.get('name', ''), D.short + ' 열기');
  $('#openWb').disabled = false;
  if (!g.allow) { $('#msg').textContent = g.offline ? '서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.' : (g.msg || '이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.'); return; }
  const u = await UNLOCK.run(D, g, KEYST);
  if (!u.ok) { $('#msg').textContent = u.msg; return; }
  if (u.key) IMGKEY = await UNLOCK.keyOf(u.key);
  renderBook();
}
async function boot() {
  if (D.enc && KEYST.get()) { const u = await UNLOCK.run(D, null, KEYST); if (u.ok) { if (u.key) IMGKEY = await UNLOCK.keyOf(u.key); renderBook(); return; } }
  renderLocked();
}
boot();
</script>

<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */
(function () {
  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}
  if (!u || u.indexOf(location.origin + '/') !== 0) return;
  var box = document.createElement('div'), a = document.createElement('a');
  box.setAttribute('style', 'max-width:780px;margin:0 auto;padding:10px 16px 0');
  a.id = 'hubBack'; a.href = u; a.textContent = '‹ 전체 앱';
  a.setAttribute('style', 'display:inline-block;padding:6px 14px 6px 10px;border:1px solid var(--line,#e1e0da);border-radius:999px;background:var(--card,#fff);color:var(--acc,#2f5bd3);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:none');
  a.onclick = function (e) {
    var t = document.getElementById('test'), h = document.getElementById('home');   // 시험 화면이 있는 앱은 그것으로, 없으면 첫 화면이 보이는지로
    var idle = t ? (t.hidden || t.offsetParent === null) : (!!h && !h.hidden && h.offsetParent !== null);
    if (!idle && !confirm('전체 앱 목록으로 돌아갈까요?\n지금 푸는 문제는 이어서 풀 수 없을 수도 있습니다.')) e.preventDefault();
  };
  box.appendChild(a);
  document.body.insertBefore(box, document.body.firstChild);
  // 선생님 앱(leess-teacher)에서 왔으면 선생님 화면을 바로 연다(코드는 선생님 앱이 이 앱의 코드 자리에 넣어 두었다). 한 번만.
  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
